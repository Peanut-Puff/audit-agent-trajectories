name: Validate skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python scripts/validate_package.py
      - run: python skills/audit-agent-trajectories/scripts/test_audit_trajectories.py -v
      - run: python skills/audit-agent-trajectories/scripts/test_normalize_trajectory_events.py -v
      - run: python skills/audit-agent-trajectories/scripts/test_classify_round_actions.py -v
      - run: python skills/audit-agent-trajectories/scripts/test_classify_round_stages.py -v
      - run: npx --yes skills add . --list
